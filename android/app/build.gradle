plugins {
    id 'com.android.application'
}

android {
    namespace 'org.shamus.reimagined'
    compileSdk 36

    defaultConfig {
        applicationId 'org.shamus.reimagined'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Keep the editable browser test harness as the single source of truth.
// Each Android build bundles the root index.html automatically for offline play.
tasks.register('syncWebGame', Copy) {
    from(rootProject.file('../index.html'))
    into(layout.projectDirectory.dir('src/main/assets'))
}
tasks.named('preBuild') {
    dependsOn('syncWebGame')
}
